[build-system]
requires = ["setuptools>=77"]   # 77+ understands license = "MIT" (SPDX expression)
build-backend = "setuptools.build_meta"

[project]
name = "air-rhythm"
description = "An osu!-style rhythm game played with your hand in front of a webcam"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Bashir Mouri" }]
# numpy 2.5 needs 3.12+; PyInstaller 6.22 supports up to 3.15
requires-python = ">=3.12,<3.16"
dynamic = ["version", "dependencies"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Games/Entertainment",
]

[project.urls]
Repository = "https://github.com/bashirmouri/air_rhythm"

[project.scripts]
air-rhythm = "air_rhythm.app:main"

# The game is one package in src/ ("src layout"): see docs/architecture.md
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
air_rhythm = ["resources/*"]

[tool.setuptools.dynamic]
version = { attr = "air_rhythm.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]               # tests import air_rhythm without installing it first

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]    # so air_rhythm and the test helpers sort as first-party imports

[tool.ruff.lint]
# F: real errors (undefined names, unused imports)   E, W: style (pycodestyle)
# I: import order   B: likely bugs (bugbear)   UP: modern Python syntax
select = ["F", "E", "W", "I", "B", "UP"]

# No `ruff format` yet: it would rewrite ~900 lines, mostly the deliberately aligned
# end-of-line comments. Lint only, until/unless we decide to adopt the formatter.
