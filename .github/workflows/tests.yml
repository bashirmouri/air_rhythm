# Runs the test suite on every push to main and every pull request, on Windows, Linux and
# macOS with every supported Python version (README: 3.12-3.15).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install ruff (version pinned in requirements-dev.txt)
        run: python -m pip install "$(grep '^ruff==' requirements-dev.txt | cut -d' ' -f1)"
      - name: Check the code
        run: ruff check --output-format=github .    # findings show up as notes on the changed lines

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false        # one failing combination shouldn't hide the others
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System libraries for OpenCV and MediaPipe (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgles2

      - name: Install the pinned packages
        run: python -m pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -v
